[package]
name = "voicepaste-stt-worker"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
voicepaste-core = { path = "../../crates/core" }
voicepaste-protocol = { path = "../../crates/protocol" }
hound = "=3.5.1"
rustfft = "=6.4.1"
tokenizers = { version = "=0.23.1", default-features = false, features = ["fancy-regex"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
ort-sys = { version = "=2.0.0-rc.10", default-features = false }
flate2 = "=1.1.5"

[build-dependencies]
cc = "=1.10.0"
