[package]
name = "voicepaste"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
voicepaste-core = { path = "../../crates/core" }
voicepaste-application = { path = "../../crates/application" }
voicepaste-protocol = { path = "../../crates/protocol" }
serde_json.workspace = true
serde.workspace = true
sha2 = "=0.10.9"
cpal = "=0.16.0"
hound = "=3.5.1"
rubato = "=0.16.2"
crossbeam-channel = "=0.5.15"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
gpui-kit = { version = "=0.8.1", default-features = false, features = ["component", "assets"] }
# Keep the component family on the same reviewed snapshot as the facade.
gpui-base = "=0.8.1"
gpui-component = "=0.8.1"
gpui-kit-assets = "=0.8.1"
raw-window-handle = "=0.6.2"

[target.'cfg(windows)'.dependencies]
windows-version = "=0.1.7"
windows = { version = "=0.62.2", features = [
    "Foundation", "Graphics_Effects", "System", "UI_Composition", "UI_Composition_Desktop",
    "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_System_WinRT_Graphics_Direct2D",
] }
windows-core = "=0.62.2"
windows-numerics = "=0.3.1"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_JobObjects", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory",
    "Win32_Networking_WinHttp", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
    "Win32_Storage_FileSystem", "Win32_System_ProcessStatus",
    "Win32_UI_HiDpi",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_Graphics_Dwm",
    "Win32_UI_Accessibility",
] }

[build-dependencies]
embed-resource = "=3.0.12"

[dev-dependencies]
gpui-kit = { version = "=0.8.1", default-features = false, features = ["component", "assets", "test-support"] }
