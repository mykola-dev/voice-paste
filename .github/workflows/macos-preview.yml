name: macOS Apple Silicon launch preview
on:
  push:
    branches: [macOS-2]
  workflow_dispatch:
    inputs:
      audit_original_artifact:
        description: Audit the exact aa24bde launch artifact without rebuilding
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-preview:
    if: ${{ !inputs.audit_original_artifact }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v5
      - name: Validate native build host
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          xcrun --find metal
          rustc --version
          # macOS defaults to /var -> /private/var. Packaging contracts reject
          # symlink ancestors deliberately; use an owned physical temp root.
          mkdir -p build/cache/tmp
          echo "TMPDIR=$(cd build/cache/tmp && pwd -P)/" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cache/target
          key: macos-26-arm64-xcode-26.6-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Format and portable contracts (not dictation qualification)
        run: |
          cargo xtask fmt
          cargo test --locked -p xtask -p voicepaste-core -p voicepaste-application -p voicepaste-protocol
          cargo clippy --locked -p xtask --all-targets -- -D warnings
      - name: Build and package ad-hoc signed launch preview
        run: cargo xtask macos-preview --release
      - name: Lint macOS host
        run: cargo clippy --locked -p voicepaste --bin voicepaste -- -D warnings
      - name: Test macOS host contracts (no GUI interaction or personal data)
        run: cargo test --locked -p voicepaste --bin voicepaste
      - uses: actions/upload-artifact@v5
        with:
          name: VoicePaste-macos-arm64-launch-preview-${{ github.sha }}
          path: build/package/*
          if-no-files-found: error
          retention-days: 14
  audit-original-package:
    if: ${{ inputs.audit_original_artifact }}
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download the original delivered artifact (not a rebuild)
        uses: actions/download-artifact@v5
        with:
          artifact-ids: '12984205097'
          run-id: '41065476513'
          github-token: ${{ github.token }}
          path: build/cache/original-artifact
          merge-multiple: true
      - name: Verify delivery round trip and record system-policy assessment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/package-audit build/cache/original-extracted
          exec > >(tee build/package-audit/audit.txt) 2>&1
          sw_vers
          uname -m
          cd build/cache/original-artifact
          archive=VoicePaste-macos-arm64-launch-preview-aa24bde347fbc4fc01021f9fd7538a5ac0a7fbc9.zip
          shasum -a 256 -c "$archive.sha256"
          unzip -Z -l "$archive"
          ditto -x -k "$archive" ../original-extracted
          cd ../original-extracted
          app=VoicePaste.app
          executable="$app/Contents/MacOS/VoicePaste"
          test -x "$executable"
          stat -f '%Sp %N' "$executable"
          plutil -lint "$app/Contents/Info.plist"
          plutil -p "$app/Contents/Info.plist"
          lipo -archs "$executable"
          otool -L "$executable"
          vtool -show-build "$executable"
          codesign --display --verbose=4 "$app"
          codesign --display --requirements - "$app"
          codesign --verify --deep --strict --verbose=4 "$app"
          # Diagnostic only: do not sign again, remove quarantine, add trust
          # rules, or disable Gatekeeper. Ad-hoc policy rejection is expected
          # and is distinct from a broken signature or missing executable bit.
          xattr -lr "$app"
          set +e
          spctl --assess --type execute --verbose=4 "$app"
          assessment=$?
          echo "spctl exit: $assessment"
          syspolicy_check distribution "$app" --verbose
          policy=$?
          echo "syspolicy_check exit: $policy"
          set -e
          # Bounded comparison for an internal XProtect error seen on hosted
          # runners: does a trivial, locally compiled ad-hoc app also get it?
          # This is diagnostic evidence only, never a replacement user package.
          control=../policy-control/Control.app
          mkdir -p "$control/Contents/MacOS"
          cp "$app/Contents/Info.plist" "$control/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier dev.mykola.voicepaste.audit-control' "$control/Contents/Info.plist"
          printf 'int main(void) { return 0; }\n' > ../policy-control/control.c
          xcrun clang ../policy-control/control.c -o "$control/Contents/MacOS/VoicePaste"
          codesign --force --sign - --timestamp=none "$control"
          codesign --verify --deep --strict --verbose=2 "$control"
          set +e
          syspolicy_check distribution "$control" --verbose
          echo "control syspolicy_check exit: $?"
          pkgutil --pkg-info com.apple.pkg.XProtectPlistConfigData
          pkgutil --pkg-info com.apple.pkg.XProtectPayloads
          /usr/bin/log show --last 3m --style compact --predicate '(process == "syspolicyd" OR process CONTAINS "XProtect") AND (eventMessage CONTAINS[c] "VoicePaste" OR eventMessage CONTAINS[c] "Control.app" OR eventMessage CONTAINS[c] "error")' 2>&1
          set -e
          echo 'Archive integrity/executable/plist/signature checks passed. Policy results above do not establish launch approval on the corporate Mac.'
      - name: Upload audit evidence even if a structural check fails
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: original-macos-package-audit-${{ github.run_id }}
          path: build/package-audit/
          if-no-files-found: error
          retention-days: 14
