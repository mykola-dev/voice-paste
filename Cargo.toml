[workspace]
members = ["crates/core", "crates/application", "crates/protocol", "apps/voicepaste", "apps/stt-worker", "xtask"]
exclude = ["crates/accesskit_macos_patched"]
resolver = "3"

[patch.crates-io]
# Backport AccessKit's KVO/Touch Bar fix until the GPUI pipeline upgrades.
accesskit_macos = { path = "crates/accesskit_macos_patched" }

[workspace.package]
edition = "2024"
version = "2.0.1"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"

[profile.dev]
debug = 0
incremental = false

# Local multi-GB integrity checks should not run unoptimized SHA rounds in dev.
[profile.dev.package.sha2]
opt-level = 3

# cargo xtask runs in dev while packaging hundreds of MB of native DLLs.
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3
